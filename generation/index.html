<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>中央大學的建築之美</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>中央大學的建築之美</h1>
    <p class="subtitle">以圖片與文字導覽校園中的代表性建築。</p>
    <div class="controls">
      <input id="search" type="search" placeholder="搜尋建築名稱、年代或建築師..." />
      <select id="filter-style">
        <option value="">所有風格</option>
      </select>
    </div>
  </header>

  <main>
    <section id="gallery" class="grid"></section>

    <section id="detail" class="detail hidden">
      <button id="back">← 返回列表</button>
      <div id="detail-content"></div>
    </section>
  </main>

  <footer>
    <p>資料範例由教學示範產生；圖像請依授權替換。</p>
  </footer>

  <script>
    let buildings = [];

    async function loadData() {
      const res = await fetch('data/buildings.json');
      buildings = await res.json();
      populateStyleFilter();
      renderList(buildings);
      const hash = location.hash.slice(1);
      if (hash) showDetailById(Number(hash));
    }

    function populateStyleFilter() {
      const styles = Array.from(new Set(buildings.map(b => b.style))).filter(Boolean);
      const sel = document.getElementById('filter-style');
      styles.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s;
        opt.textContent = s;
        sel.appendChild(opt);
      });
    }

    function renderList(items) {
      const g = document.getElementById('gallery');
      g.innerHTML = '';
      items.forEach(b => {
        const card = document.createElement('article');
        card.className = 'card';
        card.innerHTML = `
          <img data-src="b.image"alt="{b.image}" alt="b.image"alt="{b.name}" class="lazy" />
          <div class="card-body">
            <h2>${b.name}</h2>
            <p class="meta">b.year•{b.year} •b.year•{b.architect} • ${b.style}</p>
            <p class="excerpt">b.description.substring(0,120){b.description.substring(0,120)}b.description.substring(0,120){b.description.length>120?'...':''}</p>
            <button class="view" data-id="${b.id}">詳細</button>
          </div>
        `;
        g.appendChild(card);
      });
      initLazyLoad();
      document.querySelectorAll('.view').forEach(btn => {
        btn.addEventListener('click', () => showDetailById(Number(btn.dataset.id)));
      });
    }

    function initLazyLoad() {
      const imgs = document.querySelectorAll('img.lazy');
      const obs = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const img = entry.target;
            img.src = img.dataset.src;
            img.classList.remove('lazy');
            observer.unobserve(img);
          }
        });
      }, { rootMargin: '100px' });
      imgs.forEach(i => obs.observe(i));
    }

    function showDetailById(id) {
      const b = buildings.find(x => x.id === id);
      if (!b) return;
      location.hash = id;
      document.getElementById('gallery').classList.add('hidden');
      const detail = document.getElementById('detail');
      detail.classList.remove('hidden');
      const c = document.getElementById('detail-content');
      c.innerHTML = `
        <h2>${b.name}</h2>
        <p class="meta">b.year•{b.year} •b.year•{b.architect} • ${b.style}</p>
        <img src="b.image"alt="{b.image}" alt="b.image"alt="{b.name}" />
        <p class="full">${b.description}</p>
      `;
      window.scrollTo(0,0);
    }

    document.getElementById('back').addEventListener('click', () => {
      location.hash = '';
      document.getElementById('detail').classList.add('hidden');
      document.getElementById('gallery').classList.remove('hidden');
    });

    document.getElementById('search').addEventListener('input', (e) => {
      applyFilters();
    });

    document.getElementById('filter-style').addEventListener('change', () => {
      applyFilters();
    });

    function applyFilters() {
      const q = document.getElementById('search').value.trim().toLowerCase();
      const style = document.getElementById('filter-style').value;
      const results = buildings.filter(b => {
        const matchQ = !q || (b.name + ' ' + b.description + ' ' + b.architect + ' ' + b.year).toLowerCase().includes(q);
        const matchStyle = !style || b.style === style;
        return matchQ && matchStyle;
      });
      renderList(results);
    }

    window.addEventListener('hashchange', () => {
      const hash = location.hash.slice(1);
      if (!hash) {
        document.getElementById('detail').classList.add('hidden');
        document.getElementById('gallery').classList.remove('hidden');
      }
    });

    loadData();
  </script>
</body>
</html>
