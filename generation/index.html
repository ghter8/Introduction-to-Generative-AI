<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>中央大學的建築之美</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>中央大學的建築之美</h1>
    <p class="subtitle">以圖片與文字導覽校園中的代表性建築。</p>
    <div class="controls">
      <input id="search" type="search" placeholder="搜尋建築名稱、年代或建築師..." />
      <select id="filter-style">
        <option value="">所有風格</option>
      </select>
    </div>
  </header>

  <main>
    <section id="gallery" class="grid"></section>

    <section id="detail" class="detail hidden">
      <button id="back">← 返回列表</button>
      <div id="detail-content"></div>
    </section>
  </main>

  <footer>
    <p>資料範例由教學示範產生；圖像請依授權替換。</p>
  </footer>

  <script>
    let buildings = [];

    async function loadData() {
      const res = await fetch('data/buildings.json');
      buildings = await res.json();
      populateStyleFilter();
      renderList(buildings);
      const hash = location.hash.slice(1);
      if (hash) showDetailById(Number(hash));
    }

    function populateStyleFilter() {
      const styles = Array.from(new Set(buildings.map(b => b.style))).filter(Boolean);
      const sel = document.getElementById('filter-style');
      styles.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s;
        opt.textContent = s;
        sel.appendChild(opt);
      });
    }

    function renderList(items) {
      const g = document.getElementById('gallery');
      g.innerHTML = '';
      items.forEach(b => {
        const card = document.createElement('article');
        card.className = 'card';

        // 圖片（lazy load 使用 data-src）
        const img = document.createElement('img');
        img.className = 'lazy';
        img.alt = b.name || '';
        img.dataset.src = b.image || ''; // 寫入 data-src 讓 lazy loader 取用
        img.style.background = '#eee';

        // 內容區
        const body = document.createElement('div');
        body.className = 'card-body';

        const h2 = document.createElement('h2');
        h2.textContent = b.name || '';

        const meta = document.createElement('p');
        meta.className = 'meta';
        meta.textContent = `${b.year || ''} • ${b.architect || ''} • ${b.style || ''}`;
        const excerpt = document.createElement('p');
        excerpt.className = 'excerpt';
        const desc = b.description_short || '';
        excerpt.textContent = desc.length > 120 ? desc.substring(0,120) + '...' : desc;

        const btn = document.createElement('button');
        btn.className = 'view';
        btn.textContent = '詳細';
        btn.dataset.id = b.id;
        btn.addEventListener('click', () => showDetailById(Number(btn.dataset.id)));

        // 組合 card
        body.appendChild(h2);
        body.appendChild(meta);
        body.appendChild(excerpt);
        body.appendChild(btn);
        card.appendChild(img);
        card.appendChild(body);
        g.appendChild(card);
      });

      // 啟動 lazy load
      initLazyLoad();
    }


    function initLazyLoad() {
      const imgs = document.querySelectorAll('img.lazy');
      const obs = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const img = entry.target;
            img.src = img.dataset.src;
            img.classList.remove('lazy');
            observer.unobserve(img);
          }
        });
      }, { rootMargin: '100px' });
      imgs.forEach(i => obs.observe(i));
    }

    function showDetailById(id) {
      const b = buildings.find(x => x.id === id);
      if (!b) return;
      location.hash = id;
      document.getElementById('gallery').classList.add('hidden');
      const detail = document.getElementById('detail');
      detail.classList.remove('hidden');
      const c = document.getElementById('detail-content');

      // 清空舊內容
      c.innerHTML = '';

      // 標題
      const title = document.createElement('h2');
      title.textContent = b.name || '';

      // meta
      const meta = document.createElement('p');
      meta.className = 'meta';
      meta.textContent = `${b.year || ''} • ${b.architect || ''} • ${b.style || ''}`;

      // 圖片
      const img = document.createElement('img');
      img.src = b.image || '';
      img.alt = b.name || '';

      // 全文描述
      const para = document.createElement('p');
      para.className = 'full';
      para.textContent = b.description_long || '';

      // 插入 DOM
      c.appendChild(title);
      c.appendChild(meta);
      c.appendChild(img);
      c.appendChild(para);

      // 捲動到頂端
      window.scrollTo(0,0);
    }

    document.getElementById('back').addEventListener('click', () => {
      location.hash = '';
      document.getElementById('detail').classList.add('hidden');
      document.getElementById('gallery').classList.remove('hidden');
    });

    document.getElementById('search').addEventListener('input', (e) => {
      applyFilters();
    });

    document.getElementById('filter-style').addEventListener('change', () => {
      applyFilters();
    });

    function applyFilters() {
      const q = document.getElementById('search').value.trim().toLowerCase();
      const style = document.getElementById('filter-style').value;
      const results = buildings.filter(b => {
        const matchQ = !q || (b.name + ' ' + ' ' + b.description_short + ' ' + b.description_long + ' ' + b.architect + ' ' + b.year).toLowerCase().includes(q);
        const matchStyle = !style || b.style === style;
        return matchQ && matchStyle;
      });
      renderList(results);
    }

    window.addEventListener('hashchange', () => {
      const hash = location.hash.slice(1);
      if (!hash) {
        document.getElementById('detail').classList.add('hidden');
        document.getElementById('gallery').classList.remove('hidden');
      }
    });

    loadData();
  </script>
</body>
</html>
